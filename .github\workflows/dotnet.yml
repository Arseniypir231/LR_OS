name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore MedicalBillingSolution.sln

    - name: Build
      run: dotnet build MedicalBillingSolution.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test MedicalBilling.Tests/MedicalBilling.Tests.csproj --configuration Release --no-build
